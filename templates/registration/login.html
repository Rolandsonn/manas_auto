{% extends "base.html" %} {% load static %} {% block title %} Вход | ManasAuto
{% endblock %} {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/registration.css' %}?v=2" />
{% endblock %} {% block content %}

<section class="auth-section">
  <div class="auth-container">
    <div class="auth-card">
      <!-- Заголовок -->
      <div class="auth-header">
        <div class="auth-icon">
          <i class="bi bi-person"></i>
        </div>

        <h1>Вход</h1>

        <p>Войдите в свой аккаунт ManasAuto</p>
      </div>

      <!-- Форма -->
      <form method="POST" class="auth-form">
        {% csrf_token %}

        <!-- Логин -->
        <div class="auth-field">
          <label for="username"> Логин </label>

          <div class="auth-input-wrapper">
            <i class="bi bi-person"></i>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Введите логин"
              required
            />
          </div>
        </div>

        <!-- Пароль -->
        <div class="auth-field">
          <label for="password"> Пароль </label>

          <div class="auth-input-wrapper">
            <i class="bi bi-lock"></i>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Введите пароль"
              required
            />
          </div>
        </div>

        <!-- Дополнительно -->
        <div class="auth-options">
          <label class="auth-checkbox">
            <input type="checkbox" name="remember" />

            <span> Запомнить меня </span>
          </label>

          <a href="#"> Забыли пароль? </a>
        </div>

        <!-- Кнопка -->
        <button type="submit" class="auth-submit">Войти</button>
      </form>

      <!-- Регистрация -->
      <div class="auth-bottom">
        <span> Нет аккаунта? </span>

        <a href="{% url 'registration:register' %}"> Зарегистрироваться </a>
      </div>
    </div>
  </div>
</section>

{% endblock %}
